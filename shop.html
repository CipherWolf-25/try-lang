<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — MENSIFY</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">

<div id="site-header"></div>

<div class="page-banner">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / Shop</div>
    <h1>Shop All</h1>
    <p>50+ pieces across tees, outerwear, denim, footwear and accessories — filter to find your fit.</p>
  </div>
</div>

<main class="section-tight">
  <div class="container">
    <div class="filter-bar">
      <div class="filter-group">
        <select id="categoryFilter">
          <option value="">All Categories</option>
        </select>
        <select id="priceFilter">
          <option value="">All Prices</option>
          <option value="0-300">Under ₱300</option>
          <option value="300-600">₱300 – ₱600</option>
          <option value="600-1000">₱600 – ₱1,000</option>
          <option value="1000-999999">₱1,000+</option>
        </select>
        <input type="text" id="shopSearchInput" placeholder="Search this shop…">
      </div>
      <div class="filter-group">
        <div class="chip-toggle" id="quickChips">
          <button data-tag="">All</button>
          <button data-tag="new">New</button>
          <button data-tag="bestseller">Best Sellers</button>
          <button data-tag="sale">On Sale</button>
        </div>
        <select id="sortFilter">
          <option value="newest">Sort: Newest</option>
          <option value="bestseller">Sort: Best Seller</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Sort: Top Rated</option>
        </select>
      </div>
    </div>

    <div class="results-count" id="resultsCount" style="margin-bottom:18px;"></div>
    <div class="product-grid" id="shopGrid"></div>
    <div class="pagination" id="shopPagination"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/product-images.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
