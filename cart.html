<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — MENSIFY</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">

<div id="site-header"></div>

<div class="page-banner">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / Cart</div>
    <h1>Your Cart</h1>
  </div>
</div>

<main class="section-tight">
  <div class="container">
    <div id="cartEmpty" class="empty-state" style="display:none;">
      <span class="glyph">🛍️</span>
      <h3>Your cart is empty</h3>
      <p>Looks like you haven't added anything yet. Let's fix that.</p>
      <a href="shop.html" class="btn btn-dark">Continue Shopping</a>
    </div>

    <div id="cartContent" class="cart-layout" style="display:none;">
      <div>
        <div id="cartItems"></div>
        <a href="shop.html" class="btn btn-outline" style="margin-top:20px;">← Continue Shopping</a>
      </div>
      <div class="summary-card">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">₱0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span id="sumShipping">₱0.00</span></div>
        <div class="summary-row"><span>Tax (12%)</span><span id="sumTax">₱0.00</span></div>
        <div class="summary-row" id="sumCouponRow" style="display:none;"><span>Coupon Discount</span><span id="sumCoupon">-₱0.00</span></div>
        <div class="coupon-row">
          <input type="text" id="couponInput" placeholder="Coupon code (try WELCOME15)">
          <button class="btn btn-ghost btn-sm" id="applyCouponBtn">Apply</button>
        </div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal">₱0.00</span></div>
        <button class="btn btn-primary btn-block" id="checkoutBtn" style="margin-top:16px;">Proceed to Checkout</button>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/product-images.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
